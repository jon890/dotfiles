<!-- mermaid 확대 보기: 그림을 누르면 전체 화면에서 휠로 확대, 끌어서 이동. Esc 나 닫기 단추로 닫는다. mermaid.run 뒤에 둔다 -->
<style>
.mermaid svg{cursor:zoom-in}
.mz-overlay{position:fixed;inset:0;z-index:9999;background:rgba(15,17,21,.95);display:none}
.mz-overlay.on{display:block}
.mz-stage{position:absolute;inset:0;overflow:hidden;cursor:grab}
.mz-stage.drag{cursor:grabbing}
.mz-canvas{position:absolute;left:0;top:0;transform-origin:0 0;background:#fff;border-radius:10px;padding:16px;box-shadow:0 8px 40px rgba(0,0,0,.4)}
.mz-canvas svg{display:block;max-width:none!important;height:auto}
.mz-bar{position:absolute;top:14px;right:14px;display:flex;gap:6px;z-index:1}
.mz-bar button{font:600 14px/1 sans-serif;border:0;border-radius:8px;padding:9px 12px;background:#fff;color:#1d1f23;cursor:pointer}
.mz-hint{position:absolute;left:16px;bottom:14px;color:#cfd4dc;font:13px sans-serif}
</style>
<div class="mz-overlay" role="dialog" aria-label="그림 확대 보기">
  <div class="mz-stage"><div class="mz-canvas"></div></div>
  <div class="mz-bar"><button data-z="in" aria-label="확대">＋</button><button data-z="out" aria-label="축소">－</button><button data-z="fit">맞춤</button><button data-z="close">닫기</button></div>
  <div class="mz-hint">휠: 확대·축소 · 끌기: 이동 · 더블클릭: 맞춤 · Esc: 닫기</div>
</div>
<script>
(() => {
  const ov = document.querySelector('.mz-overlay'), stage = ov.querySelector('.mz-stage'), canvas = ov.querySelector('.mz-canvas');
  let s = 1, x = 0, y = 0, drag = null;
  const apply = () => { canvas.style.transform = `translate(${x}px,${y}px) scale(${s})`; };
  const fit = () => {
    const r = stage.getBoundingClientRect(), w = canvas.offsetWidth, h = canvas.offsetHeight;
    s = Math.min((r.width - 40) / w, (r.height - 80) / h, 4); x = (r.width - w * s) / 2; y = (r.height - h * s) / 2 + 20; apply();
  };
  const zoomAt = (k, cx, cy) => { const ns = Math.min(Math.max(s * k, 0.1), 12); x = cx - (cx - x) * ns / s; y = cy - (cy - y) * ns / s; s = ns; apply(); };
  const open = svg => {
    const c = svg.cloneNode(true), vb = svg.viewBox && svg.viewBox.baseVal, bb = svg.getBoundingClientRect();
    const w = vb && vb.width ? vb.width : bb.width, h = vb && vb.height ? vb.height : bb.height;
    c.removeAttribute('style'); c.setAttribute('width', w); c.setAttribute('height', h);
    canvas.replaceChildren(c); ov.classList.add('on'); document.body.style.overflow = 'hidden'; requestAnimationFrame(fit);
  };
  const close = () => { ov.classList.remove('on'); document.body.style.overflow = ''; canvas.replaceChildren(); };
  document.addEventListener('click', e => { const svg = e.target.closest('.mermaid svg'); if (svg && !ov.contains(svg)) open(svg); });
  stage.addEventListener('wheel', e => { e.preventDefault(); const r = stage.getBoundingClientRect(); zoomAt(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX - r.left, e.clientY - r.top); }, { passive: false });
  stage.addEventListener('pointerdown', e => { drag = { px: e.clientX, py: e.clientY, x, y }; stage.classList.add('drag'); stage.setPointerCapture(e.pointerId); });
  stage.addEventListener('pointermove', e => { if (!drag) return; x = drag.x + e.clientX - drag.px; y = drag.y + e.clientY - drag.py; apply(); });
  stage.addEventListener('pointerup', () => { drag = null; stage.classList.remove('drag'); });
  stage.addEventListener('dblclick', fit);
  ov.querySelector('.mz-bar').addEventListener('click', e => {
    const z = e.target.dataset.z, r = stage.getBoundingClientRect();
    if (z === 'in') zoomAt(1.3, r.width / 2, r.height / 2); else if (z === 'out') zoomAt(1 / 1.3, r.width / 2, r.height / 2); else if (z === 'fit') fit(); else if (z === 'close') close();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && ov.classList.contains('on')) close(); });
})();
</script>
