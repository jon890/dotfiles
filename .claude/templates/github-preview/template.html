<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} — GitHub 미리보기</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-light.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  body {
    margin: 0;
    background: #f6f8fa;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: #1f2328;
  }
  .wrap { max-width: 1012px; margin: 0 auto; padding: 24px; }
  .gh-header {
    background: #fff;
    border: 1px solid #d0d7de;
    border-radius: 6px 6px 0 0;
    padding: 16px 24px;
  }
  .gh-repo { color: #636c76; font-size: 13px; }
  .gh-type {
    display: inline-block;
    margin-top: 8px;
    padding: 3px 11px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    color: #fff;
    vertical-align: middle;
  }
  .gh-type.issue { background: #1a7f37; }
  .gh-type.pr { background: #8250df; }
  .gh-title {
    font-size: 22px;
    font-weight: 400;
    margin: 8px 0 0;
    color: #1f2328;
    line-height: 1.3;
  }
  .gh-title .num { color: #636c76; font-weight: 300; }
  .markdown-body {
    box-sizing: border-box;
    background: #fff;
    border: 1px solid #d0d7de;
    border-top: none;
    border-radius: 0 0 6px 6px;
    padding: 24px;
    min-height: 80px;
  }
  .gh-note {
    max-width: 1012px;
    margin: 12px auto 0;
    padding: 0 24px;
    color: #636c76;
    font-size: 12px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="gh-header">
    <div class="gh-repo">{{REPO}}</div>
    <span class="gh-type {{TYPE_CLASS}}">{{TYPE_LABEL}}</span>
    <h1 class="gh-title">{{TITLE}}</h1>
  </div>
  <article class="markdown-body" id="content">렌더링 중…</article>
</div>
<div class="gh-note">GitHub 미리보기 (github-markdown-css + marked.js). CDN 로드라 오프라인이면 스타일이 빠진다. 실제 GitHub 고유 자동링크(#번호)·:emoji: 코드는 등록 후 확인.</div>
<script type="text/markdown" id="src">{{MD_BODY}}</script>
<script>
  (function () {
    var md = document.getElementById('src').textContent;
    if (window.marked) {
      marked.setOptions({ gfm: true, breaks: false });
      document.getElementById('content').innerHTML = marked.parse(md);
    } else {
      document.getElementById('content').textContent = md;
    }
  })();
</script>
</body>
</html>
